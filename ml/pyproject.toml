[project]
name = "rockid-ml"
version = "0.1.0"
description = "RockID dataset audit, training and export pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas>=2.0",
  "pillow>=10",
  "imagehash>=4.3",
  "scikit-learn>=1.3",
  "scipy",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
# Colab already ships TensorFlow; pin it here once Phase 2 fixes the TF/converter versions.
embed = ["tensorflow"]
dev = ["pytest"]

[tool.setuptools]
packages = ["rockid_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
