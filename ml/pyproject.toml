[project]
name = "rockid-ml"
version = "0.1.0"
description = "RockID dataset audit, training and export pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas>=2.0",
  "pillow>=10",
  "imagehash>=4.3",
  "scikit-learn>=1.3",
  "scipy",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
# Versions verified by the Phase 2 TF.js smoke test (reports/train-mnv2-classes_v1-s42/versions.json):
# TF 2.21.0 + Keras 3.13 on Colab, tensorflowjs 4.22.0 installed with --no-deps (see scripts/tfjs_convert.py),
# @tensorflow/tfjs 4.22.0 in Node.
embed = ["tensorflow==2.21.0"]
dev = ["pytest"]

[tool.setuptools]
packages = ["rockid_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
